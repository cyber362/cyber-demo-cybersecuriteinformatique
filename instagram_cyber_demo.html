<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instagram — Démonstration cybersécurité</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#000;color:#fff}
body{min-height:100vh;display:flex}
.left{flex:1;min-height:100vh;position:relative;overflow:hidden;padding:55px 9%}
.right{width:34%;min-width:430px;background:#0b111c;border-left:1px solid #172131;padding:145px 4.5%}
.logo{font-weight:800;font-size:0;margin-bottom:82px}
.logo-mark{display:inline-flex;width:72px;height:48px;border-radius:15px;align-items:center;justify-content:center;background:linear-gradient(135deg,#ff9b3d,#e1306c,#833ab4);font-size:35px}
.logo-mark:after{content:"◎";font-weight:400}
.hero{font-size:56px;line-height:1.12;letter-spacing:-2px;max-width:720px}
.grad{background:linear-gradient(90deg,#fff 20%,#ff7a18 58%,#e1306c 82%);-webkit-background-clip:text;background-clip:text;color:transparent}
.cards{position:absolute;left:11%;bottom:-25px;width:72%;height:390px}
.photo{position:absolute;width:45%;height:330px;border-radius:28px;object-fit:cover;box-shadow:0 12px 35px #000; border:1px solid #222}
.p1{left:0;top:65px;transform:rotate(-7deg)}
.p2{left:24%;top:0;z-index:2;transform:rotate(-2deg)}
.p3{right:0;top:55px;transform:rotate(7deg)}
h1{font-size:23px;font-weight:400;margin:0 0 32px}
input{display:block;width:100%;height:57px;margin:0 0 16px;padding:0 18px;border:1px solid #263244;border-radius:7px;background:#080d16;color:#fff;font-size:15px}
input::placeholder{color:#657083}
button{width:100%;height:52px;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer}
.login{border:0;background:#1598ed;color:#fff;margin-top:20px}
.login:hover{background:#0b87d8}
.forgot{display:block;text-align:center;color:#aeb6c2;text-decoration:none;margin:29px 0 38px;font-size:14px}
.social,.signup{border:1px solid #21415e;background:transparent;color:#199bf0;margin-bottom:14px}
.divider{height:1px;background:#1b2430;margin:36px 0}
.foot{text-align:center;color:#657083;font-size:12px;line-height:1.5}
.demo-status{margin-top:20px;text-align:center;font-size:12px;color:#697586}
@media(max-width:900px){
 body{display:block}.left{min-height:520px;padding:35px 8%}.right{width:100%;min-width:0;border-left:0;padding:55px 8%}.hero{font-size:42px}.cards{left:8%;width:84%}
}
</style>
</head>
<body>
<section class="left">
  <div class="logo"><span class="logo-mark" aria-label="Instagram"></span></div>
  <div class="hero">
    Découvrez des moments du<br>
    quotidien de vos <span class="grad">ami(e)s<br>proches.</span>
  </div>
  <div class="cards" aria-hidden="true">
    <img class="photo p1" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=80" alt="">
    <img class="photo p2" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=700&q=80" alt="">
    <img class="photo p3" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=700&q=80" alt="">
  </div>
</section>

<section class="right">
  <h1>Se connecter à Instagram</h1>
  <form id="loginForm">
    <input id="identifiant" name="identifiant" placeholder="Numéro de mobile, nom de profil ou adresse e-mail" autocomplete="off" required>
    <input id="password" name="password" type="password" placeholder="Mot de passe" autocomplete="off" required>
    <button class="login" type="submit">Se connecter</button>
  </form>
  <a class="forgot" href="#" onclick="return false">Mot de passe oublié ?</a>
  <button class="social" type="button">● &nbsp; Se connecter avec Facebook</button>
  <button class="signup" type="button">Créer un nouveau compte</button>
  <div class="divider"></div>
  <div class="foot">Ceci est une simulation locale destinée à une démonstration de sensibilisation à la cybersécurité.</div>
  <div class="demo-status" id="status"></div>
</section>

<script>
console.log("🛡️ Démo cybersécurité active");
console.log("👉 Ouvre le DevTools (F12) pour voir ce qu’un site peut lire");

document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const identifiant = document.getElementById("identifiant").value;
  const password = document.getElementById("password").value;

  // Démonstration sûre : le mot de passe n'est ni stocké ni affiché.
  const data = {
    date: new Date().toISOString(),
    identifiant: identifiant,
    passwordLength: password.length
  };

  localStorage.setItem("cyberDemo", JSON.stringify(data));

  document.getElementById("status").textContent =
    "Simulation : aucune connexion réelle n’a été effectuée.";
  console.log("🔐 Démo : identifiant et longueur du MDP enregistrés, jamais le MDP.");

  console.table([{
    Date: data.date,
    Identifiant: data.identifiant,
    "Mot de passe": "[NON STOCKÉ]",
    "Longueur MDP": data.passwordLength
  }]);
});

if (localStorage.getItem("cyberDemo")) {
    const data = JSON.parse(localStorage.getItem("cyberDemo"));

    console.log("🔐 Données de démonstration récupérées :");
    console.table([{
        Date: data.date,
        Identifiant: data.identifiant,
        "Mot de passe": "[NON STOCKÉ]",
        "Longueur MDP": data.passwordLength
    }]);
}
</script>

</body>
</html>
